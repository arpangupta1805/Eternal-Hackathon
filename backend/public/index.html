<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eternal Lite dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">Eternal Lite</h1>
    <p class="tagline">Orders arriving over the phone-to-phone mesh</p>
    <p class="link" id="link" role="status"><span class="link-dot"></span><span id="link-text">Connecting</span></p>
  </header>

  <main class="layout">
    <section class="orders" aria-labelledby="orders-title">
      <div class="section-head">
        <h2 id="orders-title">Live orders</h2>
        <p class="section-note" id="orders-count"></p>
      </div>
      <ol class="order-list" id="order-list" aria-live="polite"></ol>
      <p class="empty" id="orders-empty" hidden>No orders yet. Place one from a phone, or run <code>node scripts/fake-device.js order --item itm_milk_500:2</code>.</p>
    </section>

    <aside class="side">
      <section class="metrics" aria-labelledby="metrics-title">
        <div class="section-head">
          <h2 id="metrics-title">Numbers</h2>
        </div>
        <dl class="metric-grid" id="metric-grid"></dl>
        <form class="attempted" id="attempted-form" onsubmit="return false">
          <label for="attempted">Orders attempted on phones</label>
          <input id="attempted" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
          <p class="attempted-out" id="success-rate">Enter a count to see the delivery success rate.</p>
        </form>
      </section>

      <section class="catalog" aria-labelledby="catalog-title">
        <div class="section-head">
          <h2 id="catalog-title">Stock and prices</h2>
          <button class="quiet-btn" id="reset-btn" type="button">Reset demo data</button>
        </div>
        <div id="catalog"></div>
      </section>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
